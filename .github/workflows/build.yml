name: Build Connect IQ Apps

on:
  push:
    branches: [beta]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PRODUCTION_APP_ID: "1a84e0de-c52e-48b2-b7ef-05c9d51ca391"
  BETA_APP_ID: "41c9373a-18fc-45ac-b68a-655b479cc311"

permissions:
  contents: write

jobs:
  build-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="1.0.0.beta${SHORT_SHA}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building beta version: $VERSION"

      - name: Set up developer key
        run: |
          echo "${{ secrets.DEVELOPER_KEY_BASE64 }}" | base64 -d > developer_key.der

      - name: Build Beta version
        run: |
          # Update version in manifest
          sed -i 's/type="watch-app" version="[^"]*"/type="watch-app" version="${{ steps.version.outputs.VERSION }}"/g' manifest.xml
          
          # Use beta app ID
          sed -i 's/${{ env.PRODUCTION_APP_ID }}/${{ env.BETA_APP_ID }}/g' manifest.xml
          
          # Modify app name for beta
          sed -i 's/>Stand-up Timer</>Stand-up Timer β</g' resources/strings.xml
          
          mkdir -p dist
          monkeyc -e -w -r \
            -f monkey.jungle \
            -o dist/standup-timer-beta-${{ steps.version.outputs.VERSION }}.iq \
            -y developer_key.der
          
          echo "Beta build complete: v${{ steps.version.outputs.VERSION }}"

      - name: Upload Beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: standup-timer-beta-${{ steps.version.outputs.VERSION }}
          path: dist/standup-timer-beta-${{ steps.version.outputs.VERSION }}.iq

      - name: Create Beta Pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta-${{ steps.version.outputs.VERSION }}
          prerelease: true
          files: dist/standup-timer-beta-${{ steps.version.outputs.VERSION }}.iq
          body: |
            ## Stand-up Timer Beta v${{ steps.version.outputs.VERSION }}
            
            ⚠️ This is a beta release for testing purposes.
            
            ### Download
            - `standup-timer-beta-${{ steps.version.outputs.VERSION }}.iq`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's|refs/tags/v||')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building production version: $VERSION"

      - name: Set up developer key
        run: |
          echo "${{ secrets.DEVELOPER_KEY_BASE64 }}" | base64 -d > developer_key.der

      - name: Build Production version
        run: |
          # Update version in manifest
          sed -i 's/type="watch-app" version="[^"]*"/type="watch-app" version="${{ steps.version.outputs.VERSION }}"/g' manifest.xml
          
          mkdir -p dist
          monkeyc -e -w -r \
            -f monkey.jungle \
            -o dist/standup-timer-${{ steps.version.outputs.VERSION }}.iq \
            -y developer_key.der
          
          echo "Production build complete: v${{ steps.version.outputs.VERSION }}"

      - name: Upload Production artifact
        uses: actions/upload-artifact@v4
        with:
          name: standup-timer-production-${{ steps.version.outputs.VERSION }}
          path: dist/standup-timer-${{ steps.version.outputs.VERSION }}.iq

      - name: Create Production Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/standup-timer-${{ steps.version.outputs.VERSION }}.iq
          body: |
            ## Stand-up Timer v${{ steps.version.outputs.VERSION }}
            
            ### Download
            - `standup-timer-${{ steps.version.outputs.VERSION }}.iq`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
